app = 'circuitbreaker-demo'
primary_region = 'sjc'

[build]

[http_service]
  internal_port = 3000
  force_https = true

  # This demo holds every viewer's breaker and dependency in memory, so it has
  # to be exactly one machine that never stops. Scaling to zero would reset the
  # breaker between visits; a second machine would round-robin a viewer between
  # two different breakers, which is the confusion the session store prevents.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

[checks]
  [checks.alive]
    type = 'http'
    port = 3000
    path = '/api/state'
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
